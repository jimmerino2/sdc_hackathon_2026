[project]
name = "sdc-hackathon-2026"
version = "0.1.0"
description = "Backend API and data pipeline for the SDC Hackathon 2026 project"
requires-python = ">=3.12"
# Union of src/backend/requirements.txt and pipeline/requirements.txt -- keep all three in sync.
dependencies = [
    "fastapi[standard]>=0.153.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.1",
    "scikit-learn>=1.9.1",
    "supabase>=2.33.0",
]
